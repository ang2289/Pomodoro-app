<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>AI 關係軍師｜台灣繁中聊天回覆助手</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#172238;--text:#f8fafc;--muted:#9fb0c9;--line:#26334d;--accent:#8b5cf6;--accent2:#ec4899;--good:#22c55e;--shadow:0 18px 50px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#182442 0,#0b1020 40%,#070b14 100%);color:var(--text);font-size:16px;line-height:1.55}
    button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{width:100%;min-height:100dvh;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom));max-width:460px}.top{padding:18px 2px 10px}.eyebrow{font-size:13px;color:#c4b5fd;font-weight:700;letter-spacing:.08em}.title{margin:4px 0 6px;font-size:28px;line-height:1.18;font-weight:800}.sub{margin:0;color:var(--muted);font-size:15px}.quota{margin-top:14px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.055);border:1px solid var(--line);padding:11px 13px;border-radius:14px}.quota b{font-size:14px}.quota span{font-size:13px;color:#cbd5e1}.card{background:linear-gradient(180deg,rgba(23,34,56,.96),rgba(16,25,43,.96));border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}.label{display:block;font-weight:700;font-size:15px;margin:0 0 9px}.helper{font-size:13px;color:var(--muted);margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.chip{border:1px solid #33415f;background:#111a2e;border-radius:13px;padding:11px 9px;min-height:46px;font-weight:700;font-size:15px}.chip.active{border-color:#a78bfa;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(236,72,153,.18));box-shadow:0 0 0 1px rgba(167,139,250,.12) inset}.textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #34425e;background:#0d1526;border-radius:15px;padding:14px;outline:none;font-size:16px}.textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}.row{display:flex;gap:8px;flex-wrap:wrap}.style-btn{flex:1 1 calc(33.333% - 8px);min-width:88px;border:1px solid #34425e;background:#0f1829;border-radius:12px;padding:10px 8px;font-size:14px;font-weight:700}.style-btn.active{border-color:#f0abfc;background:rgba(217,70,239,.16)}.strength{display:flex;gap:7px}.strength button{flex:1;border:1px solid #34425e;background:#0f1829;border-radius:11px;padding:10px 0;font-weight:800}.strength button.active{background:#7c3aed;border-color:#a78bfa}.primary{width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:17px;box-shadow:0 12px 30px rgba(139,92,246,.28)}.primary:disabled{opacity:.55;cursor:not-allowed}.status{font-size:14px;color:#cbd5e1;text-align:center;margin-top:10px}.analysis{border-left:3px solid #a78bfa;padding-left:12px;margin-bottom:14px}.analysis-title{font-size:14px;font-weight:800;color:#ddd6fe}.analysis p{margin:4px 0;color:#dbeafe;font-size:15px}.reply{background:#0d1526;border:1px solid #2e3b56;border-radius:16px;padding:14px;margin-top:10px}.reply-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.reply-label{font-size:13px;color:#f0abfc;font-weight:800}.reply-text{font-size:17px;line-height:1.55;margin:8px 0 12px;word-break:break-word}.copy{border:1px solid #465579;background:#162139;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}.copy.done{border-color:#22c55e;color:#86efac}.empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}.notice{font-size:12px;color:#91a2bd;margin:10px 2px 0}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(9,14,25,.94);backdrop-filter:blur(16px);border-top:1px solid #23304a}.nav{border:0;background:transparent;color:#93a4bd;font-size:12px;font-weight:700;padding:5px}.nav strong{display:block;color:#f8fafc;font-size:20px;line-height:1.2}.nav.active{color:#ddd6fe}.hidden{display:none}.error{color:#fecdd3;background:rgba(190,24,93,.14);border:1px solid rgba(251,113,133,.35);padding:11px;border-radius:12px;font-size:14px;margin-top:10px}
    @media(min-width:768px){body{padding:26px 0}.shell{border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);background:rgba(7,11,20,.36);box-shadow:0 0 80px rgba(0,0,0,.35)}.bottom{border:1px solid #23304a;border-bottom:0;border-radius:20px 20px 0 0}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="eyebrow">台灣繁中 AI 聊天助手</div>
      <h1 class="title">AI 關係軍師</h1>
      <p class="sub">不知道怎麼回？貼上對方的話，幫你想自然、不尷尬的下一句。</p>
      <div class="quota"><b>今日免費額度</b><span id="quotaText">5 / 5 次</span></div>
    </header>

    <section class="card">
      <span class="label">你們目前的關係</span>
      <div class="grid" id="relationshipGroup">
        <button class="chip active" data-value="crush">💘 曖昧／喜歡的人</button>
        <button class="chip" data-value="new">✨ 剛認識</button>
        <button class="chip" data-value="couple">❤️ 情侶</button>
        <button class="chip" data-value="friend">🫶 朋友</button>
        <button class="chip" data-value="work">💼 職場</button>
        <button class="chip" data-value="online">💬 網路／社群</button>
      </div>
    </section>

    <section class="card">
      <label class="label" for="message">對方說了什麼？</label>
      <textarea id="message" class="textarea" maxlength="1200" placeholder="例如：最近比較忙，有空再約吧"></textarea>
      <div class="helper">可以貼一句或一小段對話。第一版不保存聊天內容。</div>
    </section>

    <section class="card">
      <span class="label">你想怎麼回？</span>
      <div class="row" id="styleGroup">
        <button class="style-btn active" data-value="natural">自然</button>
        <button class="style-btn" data-value="funny">幽默</button>
        <button class="style-btn" data-value="flirty">曖昧</button>
        <button class="style-btn" data-value="high_eq">高情商</button>
        <button class="style-btn" data-value="direct">直接</button>
        <button class="style-btn" data-value="cool">冷淡</button>
      </div>
    </section>

    <section class="card">
      <span class="label">回覆強度</span>
      <div class="strength" id="strengthGroup">
        <button data-value="1">1</button><button class="active" data-value="2">2</button><button data-value="3">3</button><button data-value="4">4</button><button data-value="5">5</button>
      </div>
      <div class="helper">1 最保守，5 最直接；不使用髒話或羞辱式攻擊。</div>
    </section>

    <button class="primary" id="generateBtn">✨ AI 幫我回</button>
    <div id="status" class="status"></div>
    <div id="error" class="error hidden"></div>

    <section class="card hidden" id="resultCard">
      <div class="analysis">
        <div class="analysis-title">AI 判斷</div>
        <p id="analysisText"></p>
        <p id="strategyText"></p>
      </div>
      <div id="replies"></div>
    </section>

    <p class="notice">AI 建議僅供參考。不要只靠單一句話判斷對方感情或意圖；涉及威脅、騷擾或安全問題時，請優先保護自己。</p>
  </main>

  <nav class="bottom">
    <button class="nav active"><strong>💬</strong>幫我回</button>
    <button class="nav" id="historyBtn"><strong>🕘</strong>紀錄</button>
    <button class="nav" id="aboutBtn"><strong>✨</strong>Pro</button>
  </nav>

<script>
(() => {
  const DAILY_LIMIT = 5;
  const key = 'relationship_ai_usage_v1';
  let relationship = 'crush', style = 'natural', strength = 2;
  const $ = (id) => document.getElementById(id);
  const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
  function getUsage(){ try { const x=JSON.parse(localStorage.getItem(key)||'{}'); return x.date===today()?x:{date:today(),count:0}; } catch { return {date:today(),count:0}; } }
  function setUsage(x){ localStorage.setItem(key,JSON.stringify(x)); renderQuota(); }
  function renderQuota(){ const u=getUsage(); $('quotaText').textContent=Math.max(0,DAILY_LIMIT-u.count)+' / '+DAILY_LIMIT+' 次'; }
  function choose(groupId, cls, setter){ $(groupId).addEventListener('click', e => { const b=e.target.closest('button[data-value]'); if(!b)return; $(groupId).querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); setter(b.dataset.value); }); }
  choose('relationshipGroup','chip',v=>relationship=v); choose('styleGroup','style-btn',v=>style=v); choose('strengthGroup','',v=>strength=Number(v));

  async function copyText(text, btn){ await navigator.clipboard.writeText(text); btn.textContent='已複製'; btn.classList.add('done'); setTimeout(()=>{btn.textContent='複製';btn.classList.remove('done')},1200); }
  function renderReplies(list){ const box=$('replies'); box.innerHTML=''; (list||[]).forEach((r,i)=>{ const el=document.createElement('div'); el.className='reply'; const label=r.label||['最推薦','另一種說法','備選'][i]||'建議'; const text=r.text||''; el.innerHTML='<div class="reply-head"><div class="reply-label"></div></div><div class="reply-text"></div><button class="copy">複製</button>'; el.querySelector('.reply-label').textContent=label; el.querySelector('.reply-text').textContent=text; el.querySelector('.copy').addEventListener('click',e=>copyText(text,e.currentTarget)); box.appendChild(el); }); }

  $('generateBtn').addEventListener('click', async () => {
    const message=$('message').value.trim(); $('error').classList.add('hidden'); $('resultCard').classList.add('hidden');
    if(!message){ $('error').textContent='請先貼上對方說的話。'; $('error').classList.remove('hidden'); return; }
    const usage=getUsage(); if(usage.count>=DAILY_LIMIT){ $('error').textContent='今天的免費 5 次已用完。Pro 方案會在下一階段開放。'; $('error').classList.remove('hidden'); return; }
    const btn=$('generateBtn'); btn.disabled=true; btn.textContent='AI 正在想怎麼回…'; $('status').textContent='正在分析語氣與關係情境';
    try{
      const res=await fetch('/api/relationship-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,relationship,style,strength})});
      const data=await res.json(); if(!res.ok) throw new Error(data.message||data.error||'產生失敗');
      $('analysisText').textContent=data.analysis||'已分析目前訊息。'; $('strategyText').textContent=data.strategy?'建議：'+data.strategy:''; renderReplies(data.replies); $('resultCard').classList.remove('hidden'); usage.count+=1; setUsage(usage); $('resultCard').scrollIntoView({behavior:'smooth',block:'start'}); $('status').textContent='';
    }catch(err){ $('error').textContent='目前無法產生回覆：'+(err?.message||'未知錯誤'); $('error').classList.remove('hidden'); $('status').textContent=''; }
    finally{ btn.disabled=false; btn.textContent='✨ AI 幫我回'; }
  });
  $('historyBtn').addEventListener('click',()=>alert('回覆紀錄會在下一版加入。第一版先驗證「AI 幫我回」是否有人持續使用。'));
  $('aboutBtn').addEventListener('click',()=>alert('Pro 預計提供更多額度、進階模式與聊天截圖分析。'));
  renderQuota();
})();
</script>
</body>
</html>
