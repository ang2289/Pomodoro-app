<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RXV 本機圖片上傳器 V2</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f7fb;margin:0;color:#172033}
.wrap{max-width:880px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08);margin-bottom:18px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#64748b;font-size:14px}
label{display:block;font-weight:700;margin:16px 0 8px}
select,input,button{font:inherit}
select,input[type=file],input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd4e0;border-radius:10px;background:white}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff;width:100%;font-size:18px;margin-top:18px}
.secondary{background:#eef2ff;color:#334155;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{padding:12px;border-radius:10px;margin-top:14px;white-space:pre-wrap}
.ok{background:#ecfdf5;color:#166534}
.warn{background:#fff7ed;color:#9a3412}
.err{background:#fef2f2;color:#b91c1c}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:#2563eb;width:0}
.note{font-size:13px;color:#64748b;line-height:1.7}
.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#166534;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>RXV 本機圖片上傳器 V2 <span class="badge">LOCAL</span></h1>
    <div class="sub">分類固定顯示，不等待 R2；自動讀取 D:\Pomodoro-app\.env.local。</div>

    <label>選擇圖片</label>
    <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple>

    <label>圖片分類</label>
    <select id="category">
      <option value="food-drink">食物／飲品</option>
      <option value="business-office">商業／辦公</option>
      <option value="product-display">商品展示</option>
      <option value="beauty-fashion">美容／時尚</option>
      <option value="home-lifestyle">居家／生活</option>
      <option value="education">教育／學習</option>
      <option value="pet-animal">寵物／動物</option>
      <option value="wedding-event">婚禮／活動</option>
      <option value="travel-hotel">旅遊／住宿</option>
      <option value="finance">金融／理財</option>
      <option value="professional-service">專業服務</option>
      <option value="taiwan-local">台灣在地生活</option>
      <option value="flower-plant">花卉／植物</option>
      <option value="nature-landscape">自然／風景</option>
      <option value="background-wallpaper">背景／桌布</option>
      <option value="festival">節慶／節日</option>
      <option value="religion-healing" selected>宗教／療癒</option>
      <option value="technology">科技／數位</option>
      <option value="other">其他素材</option>
    </select>

    <button id="toggleCustom" type="button" class="secondary">＋ 新增自訂分類</button>

    <div id="customBox" style="display:none">
      <div class="row">
        <div>
          <label>自訂分類名稱</label>
          <input id="customName" type="text" placeholder="例如：佛像／佛教">
        </div>
        <div>
          <label>自訂分類 ID</label>
          <input id="customId" type="text" placeholder="例如：buddhist-images">
        </div>
      </div>
      <div class="note">若 ID 留空，會自動產生一個本機 ID。</div>
    </div>

    <label>圖片下載權限</label>
    <select id="permission">
      <option value="free" selected>✅ 免費下載</option>
      <option value="bundle">🔒 鎖住下載（完整素材庫）</option>
    </select>

    <button id="upload" type="button" class="primary">開始上傳</button>

    <div class="progress"><div id="progressBar"></div></div>
    <div id="status" class="status warn">正在檢查本機環境…</div>
  </div>

  <div class="card">
    <b>固定規則</b>
    <div class="note" style="margin-top:8px">
      1. 分類永遠先顯示，不受 R2 分類 API 影響。<br>
      2. 本機管理金鑰自動帶入，不需要手動輸入。<br>
      3. 這批佛像可直接選「宗教／療癒」＋「免費下載」。<br>
      4. 若上傳失敗，畫面會直接顯示真正的後端錯誤。
    </div>
  </div>
</div>

<script>
(function(){
  const byId = function(id){ return document.getElementById(id); };

  function setStatus(text, type){
    const el = byId("status");
    el.className = "status " + (type || "warn");
    el.textContent = text;
  }

  function fileToDataUrl(file){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function request(action, options){
    const response = await fetch("/api/image-admin?action=" + encodeURIComponent(action), options || {});
    const raw = await response.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; }
    catch { data = { error: raw || ("HTTP " + response.status) }; }

    if (!response.ok || data.ok === false || data.success === false) {
      throw new Error(data.error || ("HTTP " + response.status));
    }
    return data;
  }

  byId("toggleCustom").addEventListener("click", function(){
    const box = byId("customBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
  });

  byId("upload").addEventListener("click", async function(){
    const files = Array.from(byId("files").files || []);
    if (!files.length) {
      setStatus("請先選擇圖片。", "err");
      return;
    }

    let categoryId = byId("category").value;
    let categoryName = byId("category").options[byId("category").selectedIndex].text;

    if (byId("customBox").style.display !== "none" && byId("customName").value.trim()) {
      categoryName = byId("customName").value.trim();
      categoryId = byId("customId").value.trim() || ("custom-" + Date.now());
    }

    const priceType = byId("permission").value;
    const uploadButton = byId("upload");
    uploadButton.disabled = true;

    let success = 0;
    let failed = 0;
    const errors = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      byId("progressBar").style.width = Math.round((i / files.length) * 100) + "%";
      setStatus("上傳中 " + (i + 1) + " / " + files.length + "： " + file.name, "warn");

      try {
        const base64 = await fileToDataUrl(file);
        await request("uploadImage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            base64: base64,
            category_id: categoryId,
            category_name: categoryName,
            price_type: priceType,
            file_name: file.name,
            mime_type: file.type || "image/webp",
            file_size: file.size
          })
        });
        success++;
      } catch (error) {
        failed++;
        errors.push(file.name + "：" + error.message);
      }
    }

    byId("progressBar").style.width = "100%";
    uploadButton.disabled = false;

    if (failed === 0) {
      setStatus(
        "✅ 完成：成功上傳 " + success + " 張。\\n分類：" + categoryName +
        "\\n權限：" + (priceType === "free" ? "免費下載" : "鎖住下載"),
        "ok"
      );
    } else {
      setStatus(
        "⚠️ 上傳完成：成功 " + success + " 張，失敗 " + failed + " 張。\\n" +
        errors.join("\\n"),
        "err"
      );
    }
  });

  fetch("/health", { cache: "no-store" })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.ok) {
        setStatus("✅ 本機環境已就緒。可直接選分類後上傳。", "ok");
      } else {
        setStatus("⚠️ .env.local 缺少：" + (data.missing || []).join(", "), "warn");
      }
    })
    .catch(function(error){
      setStatus("⚠️ 健康檢查失敗：" + error.message, "warn");
    });
})();
</script>
</body>
</html>
