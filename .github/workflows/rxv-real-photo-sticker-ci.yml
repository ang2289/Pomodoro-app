name: RXV Real Photo Sticker Modes CI
on:
  push:
    branches:
      - codex/sticker-5-character-modes-12-styles-20261017
      - feature/rxv-sticker-excel-orders-20261018
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sticker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: A/B real photo policy and prompt regression
        run: npx tsx --test test/realPhotoStickerPrompt.test.ts test/realPhotoStickerComposition.test.ts test/stickerMotherSheetWhitespace.test.ts && node --test test/realPhotoStickerWiring.test.mjs
      - name: Existing sticker prompt regressions
        run: node --test test/rxvStickerOnboarding.test.mjs test/rxvStickerGeminiFirst.test.mjs test/rxvStickerFinalWorkflow.test.mjs test/stickerStarterLanding.test.mjs test/stickerExcelOffers.test.mjs
      - name: AI 100 style presets regression
        run: npx tsx --test test/aiImage100Presets.test.ts
      - name: TypeScript and full Vite build
        run: npm run build
