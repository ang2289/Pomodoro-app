    <!-- Affiliates.One：先暫停首頁自動載入，避免 api.pub.affiliates.one 404/429 影響主流程。
         如需啟用，請在首頁點「啟用聯盟推薦」再動態載入。 -->

    <!-- RXV 2026-09-16：統一 NT$199 完整素材庫與 NT$99 職業小包說明。 -->
    <script>
      (() => {
        const copyReplacements = [
          [
            "食物、花卉、商業圖、社群背景、桌布、節慶與更多分類，持續增加。適合網站、社群貼文、廣告、YouTube／短影音與商業設計使用。",
            "包含房仲、美髮、美甲、美容 SPA、牙醫等全部職業主題，以及食物、花卉、商業圖、社群背景、桌布、節慶等更多分類，持續增加。適合網站、社群貼文、廣告、YouTube／短影音與商業設計使用。",
          ],
          [
            "房仲、美髮、美甲、美容 SPA、牙醫等職業情境另外整理成專業小包，檔名直接標示用途。專業小包為獨立商品，不包含在 NT$199 綜合素材庫方案內。",
            "房仲、美髮、美甲、美容 SPA、牙醫等職業圖片都已包含在 NT$199 完整素材庫。若只需要單一職業，也可選擇 NT$99 專業小包，檔名直接標示用途。",
          ],
          [
            "想要大量不同題材？網站另有綜合圖片素材庫完整版，限時 NT$199。",
            "想一次取得全部圖片？完整圖片素材庫限時 NT$199，包含網站現有全部職業主題與其他圖片素材。",
          ],
          [
            "房仲、美髮等專業職業包為另外整理的商品，不包含在 NT$199 綜合素材庫方案內。",
            "若只需要單一職業素材，也可選擇 NT$99 專業小包；若需要全部圖片，選 NT$199 完整素材庫更划算。",
          ],
        ];

        const supportedPaths = new Set(["/images", "/image-packs"]);

        const applyCopyFix = () => {
          if (!supportedPaths.has(window.location.pathname)) return;
          if (!document.body) return;

          const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
          );

          let node;
          while ((node = walker.nextNode())) {
            let text = node.nodeValue || "";
            let changed = false;

            for (const [from, to] of copyReplacements) {
              if (text.includes(from)) {
                text = text.replace(from, to);
                changed = true;
              }
            }

            if (changed) node.nodeValue = text;
          }
        };

        const start = () => {
          applyCopyFix();
          const observer = new MutationObserver(applyCopyFix);
          observer.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start, { once: true });
        } else {
          start();
        }
      })();
    </script>

    <!-- RXV 2026-09-16：首頁與工具入口自動同步圖片總數與限時價格。 -->
    <script>
      (() => {
        const FALLBACK_COUNT = 2239;
        let latestCount = FALLBACK_COUNT;

        const cleanEnvValue = (value) => {
          const text = String(value || "").trim();
          if (
            !text ||
            text.includes("%VITE_") ||
            text === "undefined" ||
            text === "null"
          ) {
            return "";
          }
          return text;
        };

        const r2Base = cleanEnvValue("%VITE_PUBLIC_R2_URL%").replace(/\/$/, "");
        const configuredManifest = cleanEnvValue("%VITE_IMAGE_MANIFEST_URL%");
        const manifestUrl = r2Base
          ? `${r2Base}/catalog/images-public.json`
          : configuredManifest || "/data/images-public.json";

        const formatCount = () => latestCount.toLocaleString("zh-TW");

        const belongsToImageLibraryCard = (textNode) => {
          let element = textNode.parentElement;
          for (
            let depth = 0;
            element && depth < 10;
            depth += 1, element = element.parentElement
          ) {
            if ((element.textContent || "").includes("高畫質圖片素材庫")) {
              return true;
            }
          }
          return false;
        };

        const patchEntryCopy = () => {
          const path = window.location.pathname;
          if (path !== "/" && path !== "/tools") return;
          if (!document.body) return;

          const countLabel = formatCount();
          const walker = document.createTreeWalker(
            document.body,
            NodeFilter.SHOW_TEXT,
          );

          let node;
          while ((node = walker.nextNode())) {
            const text = node.nodeValue || "";
            let nextText = text;

            if (path === "/tools") {
              if (
                text.includes(
                  "1,583+ 張高畫質圖片完整版 NT$399，涵蓋食物、商業、花卉、社群、桌布等分類；另提供部分圖片免費試用。",
                )
              ) {
                nextText = `${countLabel} 張高畫質圖片完整版，限時 NT$199；包含房仲、美髮、美甲、美容 SPA、牙醫等職業主題，以及食物、商業、花卉、社群、桌布等分類；另提供部分圖片免費試用。`;
              } else if (
                text.trim() === "NT$399" &&
                belongsToImageLibraryCard(node)
              ) {
                nextText = text.replace("NT$399", "NT$199");
              }
            }

            if (
              path === "/" &&
              text.includes(
                "原價 NT$399，首波限時優惠 NT$199；涵蓋食物、商業、花卉、社群、桌布、節慶與更多分類，另提供部分圖片免費試用。",
              )
            ) {
              nextText = `${countLabel} 張高畫質圖片素材，原價 NT$399，限時優惠 NT$199；包含房仲、美髮、美甲、美容 SPA、牙醫等職業主題，以及食物、商業、花卉、社群、桌布、節慶等更多分類；另提供部分圖片免費試用。`;
            }

            if (nextText !== text) node.nodeValue = nextText;
          }
        };

        const countVisibleImages = (raw) => {
          const manifest = Array.isArray(raw)
            ? { images: raw, categories: [] }
            : raw || {};
          const images = Array.isArray(manifest.images) ? manifest.images : [];
          const categories = Array.isArray(manifest.categories)
            ? manifest.categories
            : [];
          const hiddenCategoryNames = new Set(["本機 WebP 測試"]);
          const hiddenCategoryIds = new Set(
            categories
              .filter((category) =>
                hiddenCategoryNames.has(String(category?.name || "").trim()),
              )
              .map((category) => String(category?.id || "").trim())
              .filter(Boolean),
          );

          return images.filter((image) => {
            if (!image?.id) return false;
            const categoryId = String(
              image.category_id ||
                image.category_slug ||
                image.category_name ||
                image.category ||
                "",
            ).trim();
            const categoryName = String(
              image.category_name || image.category || "",
            ).trim();

            return (
              !hiddenCategoryIds.has(categoryId) &&
              !hiddenCategoryNames.has(categoryId) &&
              !hiddenCategoryNames.has(categoryName)
            );
          }).length;
        };

        const start = () => {
          patchEntryCopy();

          const observer = new MutationObserver(patchEntryCopy);
          observer.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });

          fetch(manifestUrl, { cache: "no-cache" })
            .then((response) => {
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return response.json();
            })
            .then((raw) => {
              const count = countVisibleImages(raw);
              if (count > 0) {
                latestCount = count;
                patchEntryCopy();
              }
            })
            .catch((error) => {
              console.warn(
                "圖片入口數量同步失敗，暫時使用備用數量",
                error,
              );
            });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start, { once: true });
        } else {
          start();
        }
      })();
    </script>
