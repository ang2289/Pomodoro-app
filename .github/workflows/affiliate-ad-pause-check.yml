name: Pause Affiliate Ads - GitHub only

on:
  push:
    branches:
      - feature/pause-affiliate-ads-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affiliate-visibility-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run affiliate visibility regression checks
        run: node --test test/affiliateAdPause.test.mjs
      - name: Check TypeScript and Vite Build
        run: npm run build
