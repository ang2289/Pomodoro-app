<h1>RxV Publisher Helper V39.21</h1>
<div id="status" class="box">檢查中…</div>
<div class="box small">
<strong>用途：</strong>在你平常使用、已登入的 Edge 裡準備 Facebook／TikTok／Pinterest 發布內容。<br>
不會自動輸入密碼、不繞過驗證、不使用平台 API。<br>

</div>
<button id="sendTikTok">重新送出最近 TikTok 工作</button>
<button id="wake">檢查工作佇列（含 Pinterest）</button>
